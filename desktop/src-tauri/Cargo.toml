[package]
name = "metrajai-desktop"
version = "1.3.0"
description = "MetrajAI engineer-reviewed local quantity takeoff"
authors = ["MetrajAI"]
edition = "2021"

[lib]
name = "metrajai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
