[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metrajai"
version = "1.2.0"
description = "Engineer-reviewed, local-first construction quantity takeoff engine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ezdxf>=1.4,<2",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "uvicorn>=0.34,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]
reference = [
  "ifcopenshell==0.8.5",
  "shapely>=2.1,<3",
]

[project.scripts]
metrajai = "metrajai.cli:main"

[tool.setuptools.packages.find]
include = ["metrajai*"]

[tool.setuptools.package-data]
metrajai = ["report_builder.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["metrajai"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
