name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check metrajai tests scripts
      - run: mypy metrajai
      - run: pytest -q

  build-desktop:
    needs: test-engine
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/build_macos_ocr.py
      - run: python scripts/package_sidecar.py
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: MetrajAI-macOS
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*
            desktop/src-tauri/target/release/bundle/macos/*

  build-windows:
    needs: test-engine
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/package_sidecar.py
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run tauri -- build --config src-tauri/tauri.windows.conf.json
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: MetrajAI-Windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
